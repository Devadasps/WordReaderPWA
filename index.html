<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocTools - Word Reader</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <style>
        /* Master Theme Variables */
        :root {
            --bg-color: #121212; --panel-bg: #1e1e1e; --text-color: #e0e0e0;
            --border-color: #333; --toolbar-bg: #252526; --accent-blue: #3498db;
            --accent-hover: #2980b9; --shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        [data-theme="light"] {
            --bg-color: #e9ecef; --panel-bg: #ffffff; --text-color: #212529;
            --border-color: #dee2e6; --toolbar-bg: #f8f9fa; --shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        
        /* Unified Structure */
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg-color); color: var(--text-color); transition: 0.3s; overflow: hidden; }
        
        .app-menu { background: var(--panel-bg); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--accent-blue); flex-shrink: 0; }
        .app-menu-brand { font-size: 1.2rem; font-weight: bold; color: var(--text-color); text-decoration: none; }
        .app-menu-links { display: flex; gap: 10px; }
        .app-menu-links a { color: var(--text-color); text-decoration: none; padding: 8px 14px; border-radius: 4px; font-weight: bold; transition: 0.2s; }
        .app-menu-links a:hover { background: var(--toolbar-bg); }
        .app-menu-links a.active { background: var(--accent-blue); color: #fff; }
        .app-menu-actions { display: flex; gap: 10px; }
        
        .toolbar-container { background: var(--toolbar-bg); padding: 10px 20px; display: flex; gap: 15px; align-items: center; border-bottom: 1px solid var(--border-color); flex-shrink: 0; flex-wrap: wrap; }
        .content-area { flex: 1; overflow: auto; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        /* Word Reader Specifics */
        .document-box { background: var(--panel-bg); width: 100%; max-width: 900px; padding: 40px; border-radius: 8px; box-shadow: var(--shadow); line-height: 1.6; }
        .btn-primary { background: var(--accent-blue); color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-secondary { background: var(--toolbar-bg); color: var(--text-color); border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-secondary:hover { background: var(--border-color); }
        .btn-file { background: #27ae60; color: #fff; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; display: inline-block; }
        .btn-file:hover { background: #219653; }
        
        /* Table Fix */
        .document-box table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .document-box th, .document-box td { border: 1px solid var(--border-color); padding: 10px; text-align: left; }
        .document-box th { background-color: var(--toolbar-bg); font-weight: bold; }
        
        @media (max-width: 768px) { .app-menu { flex-direction: column; gap: 15px; } .app-menu-links { flex-wrap: wrap; justify-content: center; } }
    </style>
</head>
<body>
    <nav class="app-menu">
        <a href="#" class="app-menu-brand">DocTools</a>
        <div class="app-menu-links">
            <a href="index.html" class="active">Word Reader</a>
            <a href="img2pdf.html">Image to PDF</a>
            <a href="pdfviewer.html">PDF Viewer</a>
        </div>
        <div class="app-menu-actions">
            <button id="theme-toggle" class="btn-secondary">☀️ Light Mode</button>
            <button id="fullscreen-toggle" class="btn-primary">⛶ Full Screen</button>
        </div>
    </nav>

    <div class="toolbar-container">
        <label class="btn-file">
            📂 Open Word Document
            <input type="file" id="upload-doc" accept=".docx" style="display:none;" />
        </label>
        <span style="color: var(--text-color); font-size: 0.9rem;">(or open file via Windows)</span>
    </div>

    <div class="content-area">
        <div class="document-box" id="document-container">
            <em style="color: var(--border-color);">Your document content will appear here...</em>
        </div>
    </div>

    <script>
        // --- Global UI Logic (Theme & Fullscreen) ---
        const themeToggle = document.getElementById('theme-toggle');
        const fullscreenToggle = document.getElementById('fullscreen-toggle');
        
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            themeToggle.textContent = theme === 'light' ? '🌙 Dark Mode' : '☀️ Light Mode';
        }
        setTheme(localStorage.getItem('theme') || 'dark');
        
        themeToggle.addEventListener('click', () => setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));
        
        fullscreenToggle.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
                fullscreenToggle.textContent = "⛶ Exit Full Screen";
            } else {
                document.exitFullscreen();
                fullscreenToggle.textContent = "⛶ Full Screen";
            }
        });

        // --- Word Reader Logic ---
        function convertAndDisplay(file) {
            document.getElementById('document-container').innerHTML = "<em style='color: var(--accent-blue);'>Loading document...</em>";
            const reader = new FileReader();
            reader.onload = function(loadEvent) {
                mammoth.convertToHtml({ arrayBuffer: loadEvent.target.result })
                    .then(result => document.getElementById('document-container').innerHTML = result.value)
                    .catch(error => document.getElementById('document-container').innerHTML = "<p style='color:#e74c3c;'>Error reading document.</p>");
            };
            reader.readAsArrayBuffer(file);
        }
        document.getElementById('upload-doc').addEventListener('change', e => { if (e.target.files[0]) convertAndDisplay(e.target.files[0]); });
        if ('launchQueue' in window) window.launchQueue.setConsumer(async (lp) => { if (lp.files.length) convertAndDisplay(await lp.files[0].getFile()); });
    </script>
</body>
</html>
